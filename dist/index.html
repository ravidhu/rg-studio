t use more than {final}, because of its sub-groups`,capJoin:`: `,surplus:{one:`the remaining {count} goes to {sharers}{how}, hence {finals}.`,other:`the remaining {count} go to {sharers}{how}, hence {finals}.`},noSurplus:`hence {finals}.`,howWeights:` by their weights`,howEqual:` in equal shares`,idle:{one:`{groups} gets no query: its hard limit, or that of its sub-groups, is 0.`,other:`{groups} get no query: their hard limits, or those of their sub-groups, are 0.`},next:`Next ring, {group} ({total}): {finals}.`},centreWeight:`weight`,zoomOut:`Go up one level from {group}`,tipSlots:`{slots} simultaneous queries, average share when every group is saturated`,tipParent:`{percent} % of {parent}`,tipHard:`Hard limit: {hard}`,tipLimited:`Limited by {reason}`,tipWeight:`Weight share: {percent} %`,limited:{noDemand:`no demand`,ownHard:`its own hard limit`,demand:`its demand, which is met`,subGroups:`what its sub-groups can use`,parentCap:`the limit of {group}`,weightShare:`the sharing by weight in {group}`,parentShare:`what {group} receives`},memoryTitle:`Memory ceilings`,cpuTitle:`CPU ceilings`,sumCeilings:`Ceilings add up to {percent} % of the cluster`,statusWithin:`Within the cluster`,statusAbove:`Above 100 %`,noLimit:`no limit`,aboveCluster:`above the cluster`,effective:`reached first`,limitedByGroup:`{group} is limited by {holder}: {value}`,limitedByOwn:`{group} is limited by its own limit: {value}`,noOwnUpTo:`no own limit (up to {value})`,aboveParent:`above its parent`,ofCluster:`{percent} % of the cluster`,limitedBy:`limited by {holder}: {value}`,clusterBox:`Cluster {value}`,aboveClusterBy:`+{percent} % above the cluster ({value})`,aboveOwnBy:`+{value}`,aboveOwnTip:`Sub-groups ask for {total} in total, {ratio}\xA0× this ceiling ({value})`,subBadge:`sub-groups: {total} ({ratio}\xA0×)`,excessLabel:`sub-groups: +{value} above {group}'s ceiling`,legendOwn:`own ceiling`,legendAbove:`above the ceiling`,legendNoOwn:`no own limit`,legendSoft:`soft limit`,softTick:`soft {value}`,cpuNoPeriod:`cpuQuotaPeriod is not set: CPU limits cannot be converted to vCPUs and cannot be enforced. Set it on the Configuration page, in the global settings of the Groups tab.`,cpuNone:`No group at this level has a CPU limit.`,memoryNone:`No group at this level has a memory limit.`,cpuPeriodMissing:`set, quota period missing`,concurrencyTitle:`Concurrency limits`,legendSlots:`queries obtained (group colour)`,legendHard:`room up to the hard limit`,legendParent:`each group's parent limit`,legendQueue:`queue capacity (group colour)`,legendHelpLabel:`Explain the legend`,legendHelpConcurrency:`Filled part: the simultaneous queries that the group gets when every group has queries waiting.

queued} queued queries, the new queries of {group} are rejected.`},diagrams:{illustrative:`Illustrative values`,fromConfig:`Current configuration`,ancestors:`One running query (the dot) takes one place in its leaf group and in every group that contains it. Each box shows running queries / hard limit.`,query:`one running query`,oversubAbove:`The hard limits of the sub-groups of {parent} add up to {sum}, but {parent} lets only {cap} queries run at once. The part past the line cannot all be used at the same time.`,oversubWithin:`The hard limits of the sub-groups of {parent} add up to {sum}, within its own limit of {cap}: nothing is oversubscribed here.`,other:`others`,softHard:`Number of queries of {group}, not to scale. Up to the soft limit it starts queries normally. Between the soft and the hard limit it has a lower priority than the other sub-groups of its parent. At the hard limit new queries wait, and once maxQueued are waiting the next ones are rejected.`,exampleGroup:`group`,softWord:`soft`,hardWord:`hard`,exampleSibling:`another group`,leaf:`A selector can send queries to a group without sub-groups. A group that has sub-groups cannot receive queries.`,selectorWord:`selector`,parentWord:`parent`,receives:`receives queries`,rootsCaption:`Every limit of every root group, and their sums. Memory and CPU sums are also given as a share of the cluster.`,rootsRunning:`Running`,rootsQueued:`Queued`,rootsMemory:`Memory`,rootsCpu:`Hard CPU`,rootsSum:`Sum`,memory:`From the RAM of one worker to the GB of a group. The percentage of a group is applied to the cluster query memory.`,memRam:`RAM of one worker`,memHeap:`JVM heap, {percent} % of the RAM`,memQuery:`For all running queries: heap minus headroom`,memCluster:`Cluster query memory, x {workers} workers`,cpu:`Queries that {group} may run, depending on the CPU time it has used in the current period ({period}). Full concurrency up to the soft limit, then a penalty lowers it as the usage nears the hard limit.`,cpuAllowed:`queries allowed`,policies:`Twelve queries started under contention by three saturated sub-groups A, B and C. Only the policy of the parent changes. Under fair and query_priority the weights are ignored. Under weighted the split is a random draw, so the numbers are averages. Under query_priority the query with the highest priority runs first, whatever its group.`,polWeightA:`A, weight 3`,polWeightB:`B, weight 2`,polWeightC:`C, weight 1`,polPriority:`query priority`,polOrder:`highest first`,selectors:`Selectors of the current configuration, in evaluation order. A query takes the first one whose conditions all match and lands in its group.`,selQuery:`Query`,selAny:`any query`,selMore:`and {count} more`,selRejected:`No match`,selNone:`The configuration has no selector to draw.`,regex:`The pattern must cover the whole value. Filled characters are covered by the pattern. Dashed ones are left over, so the value does not match.`,regexPattern:`pattern`,regexValue:`value`,templates:`One template group gives one real group per user. Each created group gets the limits written on the template.`,tplUser:`user`,tplTemplate:`template group`,tplCreated:`created groups`,manager:`The same tree written twice: nested in the file, flat with a parent column in the database.`,model:`A parent with 100 simultaneous queries and three saturated children with weights 5, 3 and 2. A has a hard limit of 30.`,modelStep1:`1. Share by weight 5 : 3 : 2`,modelStep2:`2. A stops at its limit of 30, 20 are left over`,modelStep3:`3. The 20 are shared 3 : 2 between B and C`},topics:{conceptYaml:{title:`Accepted YAML shapes`,what:`Two YAML shapes are accepted, recognised by their top keys; the shape sets the manager. The first is resource-groups.json in YAML (rootGroups, subGroups, selectors, cpuQuotaPeriod) and sets File. The second is the database loader format and sets Database: environment, ownership, optional global_properties and external_groups, groups nested under subgroups with explicit ids, and selectors naming their group by path with a priority.`,interaction:`External groups exist only in the database: selectors may target them, and their limits are not shown. Templating is not evaluated, and tags and more than fifty aliases are refused. The ownership block is kept for export, not interpreted.`},conceptMemoryOver:{title:`What it means when memory ceilings exceed 100 %`,what:`Memory ceilings at one level may add up to more than the cluster query memory: this is allowed and common. A softMemoryLimit is a ceiling, not a reservation: groups compete for the same memory and none is guaranteed its share.`,interaction:`At or below 100 %, the ceilings come close to reservations, but memory sits idle when a group is quiet. Above 100 %, the use of the cluster is favoured over the isolation of the groups.`},conceptCpuOver:{title:`What it means when CPU ceilings exceed 100 %`,what:`Hard CPU limits at one level may add up to more vCPUs than the cluster has, which is allowed. A CPU limit caps CPU time per quota period; it reserves no cores. No group is guaranteed CPU time.`,interaction:`At or below 100 %, every group could reach its limit at once. Above 100 %, the cores run out first, so the limits favour the use of the cluster over the isolation of the groups.`},conceptSunburst:{title:`Reading the simultaneous queries chart`,what:`When every group has queries waiting, each group receives a share of what its parent receives: by weight (schedulingWeight) under weighted and weighted_fair, in equal shares under the other policies. A group never gets more than its hard limit or what its sub-groups can use; what it cannot take goes to its siblings, shared the same way. With weights 3 and 1, the first group gets 3 simultaneous queries out of 4. The selected group is at the centre, with its sub-groups in the rings outwards.`,interaction:`In the default mode, every percentage is a share of what the parent receives; tooltips give the hard limits. The Weight share mode shows the weights alone, multiplied down the tree, before hard limits apply. Root groups have no limit above them, so the chart shows one root at a time. Select a ring to open it; the centre goes one level up.`},conceptCeilings:{title:`Reading the memory and CPU ceilings`,what:`Each card maps ceilings as boxes whose area is an amount, on one scale at every level: GB of memory, or vCPUs from hardCpuLimit and the quota period. The dashed frame is the cluster; ceilings beyond it run below the frame, striped, with the excess labelled, counted from own ceilings like the status line. A line across a CPU box is the soft limit. Groups without a limit of their own share what their parent leaves unreserved and never count in the excess.`,interaction:`Select a box to open its sub-groups. A closed box is the own ceiling of its group, with a label giving their total when its sub-groups ask for more. An open box grows to hold them, with a dashed line at its own ceiling.`},conceptSizing:{title:`How the cluster size is computed`,what:`The cluster size entered in the side menu turns percentages and CPU time into GB and vCPUs, so a memory percentage is a share of these {queryMemory}\xA0GB. A single query is also capped by query.max-memory (cluster) and query.max-memory-per-node (each worker), which are separate from resource groups. The page leaves the coordinator out; it only counts when it also runs queries.`,interaction:`The heap share (70 to 85 % of the node memory) comes from the deployment guide, and the headroom from the default of memory.heap-headroom-per-node (30 % of the heap). Replace both with your jvm.config and config.properties values.`},conceptSoftHard:{title:`Soft and hard limits`,what:`A hard limit is a ceiling: hardConcurrencyLimit caps the queries a group runs, hardCpuLimit its CPU time per period. A soft limit is where a group starts to give way. Above softConcurrencyLimit its priority drops: it goes after the siblings that have queries waiting and are below their own soft limit. Above softCpuLimit its maximum number of running queries is reduced.`,interaction:`No limit stops a running query, apart from the queue limit which rejects new ones. A group that runs out of a resource makes new queries wait.`},conceptAncestors:{title:`A query counts in its group and in every ancestor`,what:`A query runs in one leaf group but counts in that group and in every ancestor up to the root. It starts only if every group on that path still has room.`,interaction:`So sub-groups may add up to more than their parent: the parent caps the total, and the scheduling policy picks which sub-group goes next. This is normal: a busy group can use what an idle sibling leaves.`},conceptLeaf:{title:`Only leaf groups receive queries`,what:`Only leaf groups, the groups without sub-groups, receive queries: a group has sub-groups or queries, never both. Selectors must therefore target a leaf group.`},conceptClusterMemory:{title:`What the memory percentage refers to`,what:`A softMemoryLimit written as a percentage is a share of the memory of the cluster, the same base for every group whatever its depth. 50 % on a sub-group is half of the cluster, not half of its parent.`,interaction:`The parent still matters, because the memory of a query counts in every ancestor: the lowest limit on the path is reached first.`},conceptCpu:{title:`Reading CPU limits as vCPUs`,what:`A CPU limit (softCpuLimit, hardCpuLimit) is the CPU time a group may use per cpuQuotaPeriod. Dividing by the period gives the average number of busy vCPUs: 48h per 1h means 48 vCPUs kept busy for the whole hour.`,interaction:`Compare the result with the vCPUs of the cluster: a hard limit above the cluster size can never be reached. Soft limits of siblings that add up to more than the cluster cannot all be reached together.`},conceptPolicies:{title:`Scheduling policies`,unit:`fair, weighted_fair, weighted, query_priority`,fallback:`fair`,what:`The policy picks which queued query runs and how sub-groups take turns. fair: first in, first out; sub-groups take turns. weighted_fair: the sub-group running the fewest queries relative to its weight share goes next. weighted: sub-groups are drawn at random by weight, queries by their query_priority session property. query_priority: queries run strictly by priority, and sub-groups must use query_priority too.`,interaction:`The policy is set on the parent and the weights on its children. A weight has no effect under fair or query_priority.`},conceptSelectorOrder:{title:`Order of selectors`,what:`With the file-based manager, selectors are read in file order and the first one that matches is used. With the database manager, they are processed in descending order of the priority column.`},conceptRegex:{title:`Patterns are Java regular expressions`,what:`Conditions such as user and source are Java regular expressions (java.util.regex). This page runs patterns with the JavaScript engine and reports Java-only syntax instead of guessing.`,verified:`The pattern must match the whole value, as in the documentation example where a source that includes pipeline is written .*pipeline.*. All the fields of one selector must match together.`},conceptTemplates:{title:`Template variables`,unit:"${USER}, ${SOURCE}, named groups",what:"A group name may contain ${USER} or ${SOURCE}, replaced by the query's user or source, which creates one group per value. A named group of a selector pattern, such as (?<toolname>.*), is used the same way as ${toolname}.",interaction:`Each created group gets the limits written on the template, and they all count in the same parent.`},conceptRoots:{title:`Root groups are independent`,what:`${Rb} The cluster-wide limits are the cluster query memory shared by all running queries and the per-query limits such as query.max-memory.`},conceptModel:{title:`How the simulation of simultaneous queries works`,what:`This is a model, not the scheduler: it computes the stable state reached when every leaf group asks for more than it can get. Each parent shares its simultaneous queries between its children by weight. A child at its hard limit, or at the most its children can use, keeps that amount and the rest is shared among the others.`,interaction:`The model ignores soft concurrency limits, memory and CPU limits, query priorities, arrival order, query duration and randomness.`},conceptManager:{title:`File or database manager`,what:`The file-based manager reads resource-groups.json on the coordinator. The database manager reads the resource_groups, selectors and resource_groups_global_properties tables and reloads them every second by default, so a change applies to incoming queries without a restart.`,interaction:`Both describe the same settings: camelCase keys and a nested tree in the file, snake_case columns and a parent column in the tables. On this page the manager comes from the import or the example; a new configuration asks for it.`},name:{title:`name`,unit:`text, may be a template`,fallback:`required`,what:`Name of the group. Selectors refer to it by its full name: the path from the root joined with dots, such as global.etl.`,interaction:`Unique among the sub-groups of one parent.`},maxQueued:{title:`maxQueued`,unit:`whole number of queries`,fallback:`required`,what:`Maximum number of queries the group may keep waiting in its queue. Once this limit is reached, new queries are rejected.`},hardConcurrencyLimit:{title:`hardConcurrencyLimit`,unit:`whole number of queries`,fallback:`required`,what:`Maximum number of queries the group runs at the same time. Other queries wait in the queue, up to maxQueued.`,interaction:`A running query also counts in every ancestor. Sub-groups may add up to more than their parent, which caps the total.`},softConcurrencyLimit:{title:`softConcurrencyLimit`,unit:`whole number of queries`,what:`Number of running queries above which the group has a lower priority. See Soft and hard limits for the rule.`,interaction:`The group may still grow up to its hard limit when its siblings are idle.`},softMemoryLimit:{title:`softMemoryLimit`,unit:`percentage such as 80% or size such as 100GB`,what:`Maximum distributed memory the group may use before new queries become queued. Running queries are not stopped.`,interaction:`A percentage is a share of the cluster memory, not of the parent.`},softCpuLimit:{title:`softCpuLimit`,unit:`duration such as 10h`,what:`Maximum CPU time the group may use per period before a penalty is applied to its maximum number of running queries. hardCpuLimit must also be set.`,interaction:`Needs cpuQuotaPeriod. Must not be above hardCpuLimit.`},hardCpuLimit:{title:`hardCpuLimit`,unit:`duration such as 20h`,what:`Maximum CPU time the group may use per period.`,interaction:`Needs cpuQuotaPeriod. The CPU time of a query counts in every ancestor.`},hardPhysicalDataScanLimit:{title:`hardPhysicalDataScanLimit`,unit:`size such as 50TB`,what:`Maximum amount of data the group may scan per period before new queries become queued. It must be an absolute size.`,interaction:`Needs physicalDataScanQuotaPeriod.`},schedulingPolicy:{title:`schedulingPolicy`,unit:`fair, weighted_fair, weighted, query_priority`,fallback:`fair`,what:`How the group picks the queued queries to run, and which of its sub-groups may start theirs. It applies to the sub-groups of the group where it is set.`,interaction:`Under query_priority every sub-group must use query_priority too.`},schedulingWeight:{title:`schedulingWeight`,unit:`whole number`,fallback:`1`,what:`Weight of the sub-group among its siblings, used when the policy of its parent is weighted or weighted_fair. With weights 350 and 150, the first sub-group starts about 70 % of the queries and the second 30 %.`,interaction:`Only the ratio between siblings matters. It has no effect on a root group.`},jmxExport:{title:`jmxExport`,unit:`true or false`,fallback:`false`,what:`When true, the group exports its statistics to JMX, for monitoring.`,interaction:`Set per group, not inherited.`},subGroups:{title:`subGroups`,unit:`list of groups`,what:`The groups nested under this group. In the database the tree comes from the parent column, which holds the resource_group_id of the parent and is empty for a root.`,interaction:`A group with sub-groups cannot receive queries itself.`},environment:{title:`environment`,unit:`text`,what:`Matched with the node.environment property of the cluster, so that several clusters can keep their configuration in the same database.`},cpuQuotaPeriod:{title:`cpuQuotaPeriod`,unit:`duration such as 1h or 10m`,what:`Window over which the CPU limits of a group are counted: softCpuLimit and hardCpuLimit are amounts of CPU time per period.`,interaction:`Set it as soon as one group has a CPU limit.`,verified:`A configuration that sets a CPU limit without a period is refused, with the message "cpuQuotaPeriod must be specified to use CPU limits on group: <name>". This applies to both managers: with the database manager, the new configuration is not applied and an error is logged.`},physicalDataScanQuotaPeriod:{title:`physicalDataScanQuotaPeriod`,unit:`duration such as 1h or 1d`,what:`Window over which hardPhysicalDataScanLimit is counted. A limit of 50TB with a period of 1d lets the group scan up to 50\xA0TB per day.`,verified:`A configuration that sets a data scan limit without physicalDataScanQuotaPeriod is refused, as for CPU limits. This applies to both managers: with the database manager, the new configuration is not applied and an error is logged. In the resource_groups_global_properties table the row is named physical_data_scan_quota_period, and the one of the CPU period cpu_quota_period: no other property name is accepted.`},selUser:{title:`user`,unit:`Java regular expression`,what:`Pattern for the user name of the query. See originalUser for a changed session user.`},selOriginalUser:{title:`originalUser`,unit:`Java regular expression`,what:`Pattern for the original user name, before any change of the session user. If user foo runs SET SESSION AUTHORIZATION bar, originalUser is foo and user is bar.`},selAuthenticatedUser:{title:`authenticatedUser`,unit:`Java regular expression`,what:`Pattern for the authenticated user name, whatever changes were made to the session user.`},selUserGroup:{title:`userGroup`,unit:`Java regular expression`,what:`Pattern for the groups the user belongs to. One matching group is enough.`},selSource:{title:`source`,unit:`Java regular expression`,what:`Pattern for the source of the query. The client sets it with the --source option of the CLI or the source property of the JDBC driver.`},selQueryText:{title:`queryText`,unit:`regular expression`,what:`Pattern for the SQL text of the query; like every pattern, it must match the whole value.`},selQueryType:{title:`queryType`,unit:`SELECT, EXPLAIN, DESCRIBE, INSERT, UPDATE, MERGE, DELETE, ANALYZE, DATA_DEFINITION, ALTER_TABLE_EXECUTE`,what:`Type of the query to match. INSERT also covers CREATE TABLE AS and REFRESH MATERIALIZED VIEW. DESCRIBE also covers SHOW queries. DATA_DEFINITION covers CREATE, ALTER and DROP statements and the management of sessions, privileges and transactions.`},selClientTags:{title:`clientTags`,unit:`list of tags`,what:`Every tag of the list must be among the client tags of the query. Clients set them with --client-tags or the clientTags property of the JDBC driver.`,interaction:`In the database the column holds a JSON list such as ["hipri"].`},selGroup:{title:`group`,unit:`path of a group`,fallback:`required`,what:`The group that matching queries run in. In the file it is the path joined with dots, such as global.etl. In the database it is the resource_group_id of the group.`,interaction:`Must be a leaf group.`},selPriority:{title:`priority`,unit:`whole number`,what:`Database only. Selectors are tried in descending order of priority: the highest number goes first.`,interaction:`In the file the order of the list plays this role.`}}},Bb=`Aucune limite commune : les groupes racines additionnent leurs limites et ne sont jamais départagés entre eux (les poids et la politique d'ordonnancement ne s'appliquent qu'entre sous-groupes d'un même parent). Seules les limites globales du cluster s'appliquent à leur total.`,Vb={app:{title:`RG Studio`,privacy:`Rien n'est envoyé nulle part : les fichiers restent dans votre navigateur.`,savedFull:`Votre configuration est enregistrée uniquement dans ce navigateur, sur cet ordinateur. Supprimez-la à tout moment depuis le menu latéral.`,savedShort:`La configuration est enregistrée dans ce navigateur uniquement.`,credit:`Fait avec {heart} par Ravidhu Dissanayake`,creditHeart:`amour`,language:`Langue`,theme:`Thème`,themeSystem:`Système`,themeLight:`Clair`,themeDark:`Sombre`,exampleData:`Données d'exemple, cliquez ici pour importer`,exampleEdited:`Données d'exemple modifiées, cliquez ici pour importer`},source:{question:`Où cette configuration sera-t-elle utilisée ?`,choose:`Choisir`,file:`Gestionnaire par fichier (resource-groups.json)`,db:`Gestionnaire par base de données (tables)`,prompt:`Indiquez où cette configuration sera utilisée : l'ordre d'évaluation des sélecteurs en dépend.`,promptLink:`Choisir le gestionnaire`,order:`Ordre d'évaluation : {order} ({manager}, {origin})`,orderList:`ordre de la liste`,orderPriority:`priorité décroissante`,managerFile:`fichier`,managerDb:`base de données`,origin:{fileJson:`d'après resource-groups.json importé`,fileYaml:`d'après le fichier YAML importé`,dbCsv:`d'après les fichiers CSV importés`,dbYaml:`d'après le YAML de chargement importé`,imported:`d'après la configuration importée`,demo:`exemple`,created:`choisi pour une configuration créée de zéro`}},storage:{restored:`Configuration restaurée depuis ce navigateur.`,discarded:`La configuration enregistrée dans ce navigateur n'a pas pu être lue et a été supprimée. L'exemple est affiché.`,deleted:`La configuration enregistrée a été supprimée. L'exemple est affiché.`,saveFailed:`Ce navigateur ne permet pas l'enregistrement : la configuration reste en quêtes de {group} en cours, ses nouvelles requêtes attendent dans la file, jusqu'à {queued} requêtes en attente.`,rejected:`Au-delà de {queued} requêtes en attente, les nouvelles requêtes de {group} sont rejetées.`},diagrams:{illustrative:`Valeurs d'illustration`,fromConfig:`Configuration actuelle`,ancestors:`Une requête en cours (le point) compte dans son groupe feuille et dans chaque groupe qui le contient. Chaque cadre indique les requêtes en cours / la limite stricte.`,query:`une requête en cours`,oversubAbove:`Les limites strictes des sous-groupes de {parent} totalisent {sum}, mais {parent} ne laisse s'exécuter que {cap} requêtes à la fois. La partie située au-delà du trait ne peut pas être utilisée entièrement en même temps.`,oversubWithin:`Les limites strictes des sous-groupes de {parent} totalisent {sum}, dans sa propre limite de {cap} : il n'y a pas de sursouscription ici.`,other:`autres`,softHard:`Nombre de requêtes de {group}, sans échelle. Jusqu'à la limite souple, le groupe démarre ses requêtes normalement. Entre la limite souple et la limite stricte, il a une priorité réduite par rapport aux autres sous-groupes de son parent. À la limite stricte, les nouvelles requêtes attendent, et lorsque maxQueued requêtes attendent, les suivantes sont rejetées.`,exampleGroup:`groupe`,softWord:`souple`,hardWord:`stricte`,exampleSibling:`un autre groupe`,leaf:`Un sélecteur peut envoyer des requêtes vers un groupe sans sous-groupe. Un groupe qui a des sous-groupes ne peut pas recevoir de requêtes.`,selectorWord:`sélecteur`,parentWord:`parent`,receives:`reçoit des requêtes`,rootsCaption:`Toutes les limites de chaque groupe racine, et leurs sommes. Les sommes de mémoire et de CPU sont aussi données en part du cluster.`,rootsRunning:`En cours`,rootsQueued:`En attente`,rootsMemory:`Mémoire`,rootsCpu:`CPU strict`,rootsSum:`Somme`,memory:`De la RAM d'un worker aux Go d'un groupe. Le pourcentage d'un groupe s'applique à la mémoire de requêtes du cluster.`,memRam:`RAM d'un worker`,memHeap:`Mémoire heap de la JVM, {percent} % de la RAM`,memQuery:`Pour toutes les requêtes : heap moins marge`,memCluster:`Mémoire de requêtes du cluster, x {workers} workers`,cpu:`Requêtes que {group} peut exécuter selon le temps CPU qu'il a consommé sur la période en cours ({period}). Concurrence complète jusqu'à la limite souple, puis une pénalité la réduit à mesure que la consommation approche de la limite stricte.`,cpuAllowed:`requêtes autorisées`,policies:`Douze requêtes démarrées sous contention par trois sous-groupes saturés A, B et C. Seule la politique du parent change. Avec fair et query_priority, les poids sont ignorés. Avec weighted, la répartition est un tirage au sort : les nombres sont des moyennes. Avec query_priority, la requête de plus haute priorité passe en premier, quel que soit son groupe.`,polWeightA:`A, poids 3`,polWeightB:`B, poids 2`,polWeightC:`C, poids 1`,polPriority:`priorité de la requête`,polOrder:`la plus haute d'abord`,selectors:`Sélecteurs de la configuration actuelle, dans l'ordre d'évaluation. Une requête prend le premier dont toutes les conditions correspondent et arrive dans son groupe.`,selQuery:`Requête`,selAny:`toute requête`,selMore:`et {count} autres`,selRejected:`Aucune correspondance`,selNone:`La configuration ne contient aucun sélecteur à représenter.`,regex:`Le motif doit couvrir la valeur entière. Les caractères pleins sont couverts par le motif. Ceux en pointillés restent en trop : la valeur ne correspond donc pas.`,regexPattern:`motif`,regexValue:`valeur`,templates:`Un groupe modèle donne un groupe réel par utilisateur. Chaque groupe créé reçoit les limites écrites sur le modèle.`,tplUser:`utilisateur`,tplTemplate:`groupe modèle`,tplCreated:`groupes créés`,manager:`Le même arbre écrit deux fois : imbriqué dans le fichier, à plat avec une colonne parent dans la base.`,model:`Un parent de 100 requêtes simultanées et trois enfants saturés de poids 5, 3 et 2. A a une limite stricte de 30.`,modelStep1:`1. Partage selon les poids 5 : 3 : 2`,modelStep2:`2. A s'arrête à sa limite de 30, il reste 20`,modelStep3:`3. Les 20 sont partagés 3 : 2 entre B et C`},topics:{conceptYaml:{title:`Formes de YAML acceptées`,what:`Deux formes de YAML sont acceptées, reconnues à leurs clés de premier niveau ; la forme détermine le gestionnaire. La première est resource-groups.json en YAML (rootGroups, subGroups, selectors, cpuQuotaPeriod) et règle le gestionnaire sur Fichier. La seconde est le format de chargement en base et le règle sur Base de données : environment, ownership, global_properties et external_groups facultatifs, groupes imbriqués sous subgroups avec des id explicites, et selectors qui nomment leur groupe par son chemin avec une priorité.`,interaction:`Les groupes externes n'existent que dans la base : des sélecteurs peuvent les cibler, et leurs limites ne sont pas affichées. Les modèles de texte ne sont pas évalués, et les tags et plus de cinquante alias sont refusés. Le bloc ownership est conservé pour l'export, pas interprété.`},conceptMemoryOver:{title:`Ce que signifie un total de plafonds de mémoire supérieur à 100 %`,what:`Les plafonds de mémoire d'un même niveau peuvent dépasser ensemble la mémoire de requêtes du cluster : c'est autorisé et courant. Un softMemoryLimit est un plafond, pas une réservation : les groupes se disputent la même mémoire et aucun n'a la garantie d'obtenir sa part.`,interaction:`À 100 % ou moins, les plafonds se rapprochent d'une réservation, mais de la mémoire reste inutilisée lorsqu'un groupe est calme. Au-delà de 100 %, l'utilisation du cluster est privilégiée par rapport à l'isolation des groupes.`},conceptCpuOver:{title:`Ce que signifie un total de plafonds de CPU supérieur à 100 %`,what:`Les limites strictes de CPU d'un même niveau peuvent dépasser ensemble les vCPU du cluster : c'est autorisé. Une limite CPU plafonne le temps CPU par période de quota et ne réserve pas de cœurs. Aucun groupe n'a la garantie d'obtenir du temps CPU.`,interaction:`À 100 % ou moins, tous les groupes pourraient atteindre leur limite en même temps. Au-delà de 100 %, les cœurs manquent en premier : les limites privilégient donc l'utilisation du cluster par rapport à l'isolation des groupes.`},conceptSunburst:{title:`Lire le graphique des requêtes simultanées`,what:`Quand tous les groupes ont des requêtes en attente, chaque groupe reçoit une part de ce que reçoit son parent : selon son poids (schedulingWeight) avec weighted et weighted_fair, à parts égales avec les autres politiques. Un groupe ne reçoit jamais plus que sa limite stricte ni que ce que ses sous-groupes peuvent utiliser ; ce qu'il ne peut pas prendre revient à sa fratrie, partagé de la même façon. Avec des poids 3 et 1, le premier groupe obtient 3 requêtes simultanées sur 4. Le groupe sélectionné est au centre, avec ses sous-groupes dans les anneaux vers l'extérieur.`,interaction:`Dans le mode par défaut, chaque pourcentage est une part de ce que reçoit le parent ; les infobulles donnent les limites strictes. Le mode Part de poids montre les poids seuls, multipliés le long de l'arbre, avant application des limites strictes. Les groupes racines n'ont aucune limite au-dessus d'eux : le graphique montre donc une racine à la fois. Sélectionnez un anneau pour l'ouvrir ; le centre remonte d'un niveau.`},conceptCeilings:{title:`Lire les plafonds de mémoire et de CPU`,what:`Chaque carte représente des plafonds par des boîtes dont l'aire est une quantité, sur une même échelle à tous les niveaux : des Go de mémoire, ou des vCPU issus de hardCpuLimit et de la période de quota. Le cadre en tirets est le cluster ; les plafonds au-delà se prolongent sous le cadre, rayés, avec le dépassement en étiquette, compté sur les plafonds propres comme la ligne d'état. Un trait en travers d'une boîte de CPU est la limite souple. Les groupes sans limite propre se partagent ce que leur parent laisse non réservé et ne comptent jamais dans le dépassement.`,interaction:`Sélectionnez une boîte pour ouvrir ses sous-groupes. Une boîte fermée a la taille du plafond propre de son groupe, avec une étiquette qui donne leur total quand ses sous-groupes demandent davantage. Une boîte ouverte grandit pour les contenir, avec une ligne en tirets à son plafond propre.`},conceptSizing:{title:`Calcul de la taille du cluster`,what:`La taille du cluster saisie dans le menu latéral convertit les pourcentages et les temps CPU en Go et en vCPU : un pourcentage de mémoire est une part de ces {queryMemory}\xA0Go. Une requête seule est aussi plafonnée par query.max-memory (cluster) et query.max-memory-per-node (chaque worker), qui sont distinctes des groupes de ressources. La page ne compte pas le coordinateur ; il ne compte que s'il exécute aussi des requêtes.`,interaction:`La part de la mémoire heap de la JVM (70 à 85 % de la mémoire du nœud) vient du guide de déploiement, et la marge de la valeur par défaut de memory.heap-headroom-per-node (30 % de la mémoire heap). Remplacez les deux par les valeurs de vos fichiers jvm.config et config.properties.`},conceptSoftHard:{title:`Limites souples et limites strictes`,what:`Une limite stricte (hard) est un plafond : hardConcurrencyLimit plafonne les requêtes qu'un groupe exécute, hardCpuLimit son temps CPU par période. Une limite souple (soft) est le seuil à partir duquel un groupe commence à céder son tour. Au-dessus de softConcurrencyLimit, sa priorité baisse : il passe après les groupes de sa fratrie qui ont des requêtes en attente et sont encore sous leur limite souple. Au-dessus de softCpuLimit, son nombre maximal de requêtes en cours est réduit.`,interaction:`Aucune limite n'arrête une requête en cours, hormis la limite de file d'attente, qui rejette les nouvelles requêtes. Un groupe à court d'une ressource fait attendre les nouvelles requêtes.`},conceptAncestors:{title:`Une requête compte dans son groupe et dans chaque ancêtre`,what:`Une requête s'exécute dans un seul groupe feuille, mais elle compte dans ce groupe et dans chaque ancêtre jusqu'à la racine. Elle ne démarre que si chaque groupe de ce chemin a encore de la capacité.`,interaction:`La somme des sous-groupes peut donc dépasser leur parent : le parent plafonne le total, et la politique d'ordonnancement choisit quel sous-groupe passe ensuite. C'est normal : un groupe occupé peut utiliser ce qu'un groupe inactif de sa fratrie laisse libre.`},conceptLeaf:{title:`Seuls les groupes feuilles reçoivent des requêtes`,what:`Seuls les groupes feuilles, ceux sans sous-groupe, reçoivent des requêtes : un groupe a soit des sous-groupes, soit des requêtes, jamais les deux. Les sélecteurs doivent donc cibler un groupe feuille.`},conceptClusterMemory:{title:`À quoi se rapporte le pourcentage de mémoire`,what:`Un softMemoryLimit écrit en pourcentage est une part de la mémoire du cluster, la même base pour tous les groupes quelle que soit leur profondeur. 50 % sur un sous-groupe représente la moitié du cluster, pas la moitié de son parent.`,interaction:`Le parent compte tout de même, car la mémoire d'une requête est comptée dans chaque ancêtre : la limite la plus basse du chemin est atteinte en premier.`},conceptCpu:{title:`Lire les limites CPU en vCPU`,what:`Une limite CPU (softCpuLimit, hardCpuLimit) est le temps CPU qu'un groupe peut consommer par cpuQuotaPeriod. En divisant par la période, on obtient le nombre moyen de vCPU occupés : 48h par 1h signifie 48 vCPU occupés pendant toute l'heure.`,interaction:`Comparez le résultat avec les vCPU du cluster : une limite stricte supérieure à la taille du cluster ne peut jamais être atteinte. Des limites souples de groupes frères dont la somme dépasse le cluster ne peuvent pas toutes être atteintes ensemble.`},conceptPolicies:{title:`Politiques d'ordonnancement`,unit:`fair, weighted_fair, weighted, query_priority`,fallback:`fair`,what:`La politique choisit quelle requête en attente s'exécute et comment les sous-groupes passent à tour de rôle. fair : premier arrivé, premier servi ; les sous-groupes passent chacun leur tour. weighted_fair : le sous-groupe qui exécute le moins de requêtes par rapport à sa part de poids passe ensuite. weighted : les sous-groupes sont tirés au sort selon leur poids, et les requêtes selon leur propriété de session query_priority. query_priority : les requêtes s'exécutent strictement par priorité, et les sous-groupes doivent aussi utiliser query_priority.`,interaction:`La politique se règle sur le parent et les poids sur ses enfants. Un poids n'a aucun effet avec fair ou query_priority.`},conceptSelectorOrder:{title:`Ordre des sélecteurs`,what:`Avec le gestionnaire par fichier, les sélecteurs sont lus dans l'ordre du fichier et le premier qui correspond est utilisé. Avec le gestionnaire par base de données, ils sont traités par ordre décroissant de la colonne priority.`},conceptRegex:{title:`Les motifs sont des expressions régulières Java`,what:`Les conditions comme user et source sont des expressions régulières Java (java.util.regex). Cette page exécute les motifs avec le moteur JavaScript et signale la syntaxe propre à Java au lieu de la deviner.`,verified:`Le motif doit correspondre à la valeur entière, comme dans l'exemple de la documentation où une source qui contient pipeline s'écrit .*pipeline.*. Tous les champs d'un même sélecteur doivent correspondre ensemble.`},conceptTemplates:{title:`Variables de modèle`,unit:"${USER}, ${SOURCE}, groupes nommés",what:"Un nom de groupe peut contenir ${USER} ou ${SOURCE}, remplacés par l'utilisateur ou la source de la requête, ce qui crée un groupe par valeur. Un groupe nommé d'un motif de sélecteur, tel que (?<toolname>.*), s'utilise de la même façon sous la forme ${toolname}.",interaction:`Chaque groupe créé reçoit les limites écrites sur le modèle, et tous comptent dans le même parent.`},conceptRoots:{title:`Les groupes racines sont indépendants`,what:`${Bb} Les limites globales du cluster sont la mémoire de requêtes du cluster, partagée par toutes les requêtes en cours, et les limites par requête telles que query.max-memory.`},conceptModel:{title:`Fonctionnement de la simulation des requêtes simultanées`,what:`C'est un modèle, pas l'ordonnanceur : il calcule l'état stable atteint lorsque chaque groupe feuille demande plus qu'il ne peut obtenir. Chaque parent partage ses requêtes simultanées entre ses enfants selon leur poids. Un enfant à sa limite stricte, ou au maximum que ses enfants peuvent utiliser, conserve cette quantité, et le reste est partagé entre les autres.`,interaction:`Le modèle ignore les limites souples de concurrence, les limites de mémoire et de CPU, les priorités des requêtes, l'ordre d'arrivée, la durée des requêtes et l'aléa.`},conceptManager:{title:`Gestionnaire par fichier ou par base de données`,what:`Le gestionnaire par fichier lit resource-groups.json sur le coordinateur. Le gestionnaire par base de données lit les tables resource_groups, selectors et resource_groups_global_properties et les recharge chaque seconde par défaut : une modification s'applique donc aux requêtes entrantes sans redémarrage.`,interaction:`Les deux décrivent les mêmes réglages : clés en camelCase et arbre imbriqué dans le fichier, colonnes en snake_case et colonne parent dans les tables. Sur cette page, le gestionnaire vient de l'import ou de l'exemple ; une nouvelle configuration le demande.`},name:{title:`name`,unit:`texte, peut être un modèle`,fallback:`obligatoire`,what:`Nom du groupe. Les sélecteurs le désignent par son nom complet : le chemin depuis la racine, séparé par des points, par exemple global.etl.`,interaction:`Unique parmi les sous-groupes d'un même parent.`},maxQueued:{title:`maxQueued`,unit:`nombre entier de requêtes`,fallback:`obligatoire`,what:`Nombre maximal de requêtes que le groupe garde en attente dans sa file. Une fois cette limite atteinte, les nouvelles requêtes sont rejetées.`},hardConcurrencyLimit:{title:`hardConcurrencyLimit`,unit:`nombre entier de requêtes`,fallback:`obligatoire`,what:`Nombre maximal de requêtes que le groupe exécute en même temps. Les autres requêtes attendent dans la file, jusqu'à maxQueued.`,interaction:`Une requête en cours compte aussi dans chaque ancêtre. La somme des sous-groupes peut dépasser leur parent, qui plafonne le total.`},softConcurrencyLimit:{title:`softConcurrencyLimit`,unit:`nombre entier de requêtes`,what:`Nombre de requêtes en cours au-dessus duquel le groupe a une priorité réduite. Voir Limites souples et limites strictes pour la règle.`,interaction:`Le groupe peut quand même monter jusqu'à sa limite stricte lorsque le reste de sa fratrie est inactif.`},softMemoryLimit:{title:`softMemoryLimit`,unit:`pourcentage tel que 80% ou taille telle que 100GB`,what:`Quantité maximale de mémoire distribuée que le groupe peut utiliser avant que les nouvelles requêtes soient mises en attente. Les requêtes en cours ne sont pas arrêtées.`,interaction:`Un pourcentage est une part de la mémoire du cluster, pas de celle du parent.`},softCpuLimit:{title:`softCpuLimit`,unit:`durée telle que 10h`,what:`Quantité maximale de temps CPU que le groupe peut consommer par période avant qu'une pénalité soit appliquée à son nombre maximal de requêtes en cours. hardCpuLimit doit aussi être défini.`,interaction:`Nécessite cpuQuotaPeriod. Ne doit pas dépasser hardCpuLimit.`},hardCpuLimit:{title:`hardCpuLimit`,unit:`durée telle que 20h`,what:`Quantité maximale de temps CPU que le groupe peut consommer par période.`,interaction:`Nécessite cpuQuotaPeriod. Le temps CPU d'une requête compte dans chaque ancêtre.`},hardPhysicalDataScanLimit:{title:`hardPhysicalDataScanLimit`,unit:`taille telle que 50TB`,what:`Quantité maximale de données que le groupe peut lire par période avant que les nouvelles requêtes soient mises en attente. Elle doit être une taille absolue.`,interaction:`Nécessite physicalDataScanQuotaPeriod.`},schedulingPolicy:{title:`schedulingPolicy`,unit:`fair, weighted_fair, weighted, query_priority`,fallback:`fair`,what:`Façon dont le groupe choisit les requêtes en attente à exécuter, et celui de ses sous-groupes qui peut démarrer les siennes. Elle s'applique aux sous-groupes du groupe sur lequel elle est définie.`,interaction:`Avec query_priority, chaque sous-groupe doit lui aussi utiliser query_priority.`},schedulingWeight:{title:`schedulingWeight`,unit:`nombre entier`,fallback:`1`,what:`Poids du sous-groupe au sein de sa fratrie, utilisé lorsque la politique de son parent est weighted ou weighted_fair. Avec des poids de 350 et 150, le premier sous-groupe démarre environ 70 % des requêtes et le second 30 %.`,interaction:`Seul le rapport entre les groupes d'une fratrie compte. Sans effet sur un groupe racine.`},jmxExport:{title:`jmxExport`,unit:`true ou false`,fallback:`false`,what:`Si true, le groupe exporte ses statistiques vers JMX, pour la supervision.`,interaction:`Se règle groupe par groupe, sans héritage.`},subGroups:{title:`subGroups`,unit:`liste de groupes`,what:`Les groupes imbriqués sous ce groupe. Dans la base, l'arbre vient de la colonne parent, qui contient le resource_group_id du parent et reste vide pour une racine.`,interaction:`Un groupe qui a des sous-groupes ne peut pas recevoir de requêtes lui-même.`},environment:{title:`environment`,unit:`texte`,what:`Comparé à la propriété node.environment du cluster, afin que plusieurs clusters puissent conserver leur configuration dans la même base.`},cpuQuotaPeriod:{title:`cpuQuotaPeriod`,unit:`durée telle que 1h ou 10m`,what:`Fenêtre sur laquelle les limites CPU d'un groupe sont comptées : softCpuLimit et hardCpuLimit sont des quantités de temps CPU par période.`,interaction:`Définissez-la dès qu'un groupe a une limite CPU.`,verified:`Une configuration qui définit une limite CPU sans période est refusée, avec le message « cpuQuotaPeriod must be specified to use CPU limits on group: <name> ». Cela vaut pour les deux gestionnaires : avec le gestionnaire par base de données, la nouvelle configuration n'est pas appliquée et une erreur est journalisée.`},physicalDataScanQuotaPeriod:{title:`physicalDataScanQuotaPeriod`,unit:`durée telle que 1h ou 1d`,what:`Fenêtre sur laquelle hardPhysicalDataScanLimit est compté. Une limite de 50TB avec une période de 1d laisse le groupe lire jusqu'à 50\xA0To par jour.`,verified:`Une configuration qui définit une limite de données lues sans physicalDataScanQuotaPeriod est refusée, comme pour les limites CPU. Cela vaut pour les deux gestionnaires : avec le gestionnaire par base de données, la nouvelle configuration n'est pas appliquée et une erreur est journalisée. Dans la table resource_groups_global_properties, la ligne se nomme physical_data_scan_quota_period, et celle de la période CPU cpu_quota_period : aucun autre nom de propriété n'est accepté.`},selUser:{title:`user`,unit:`expression régulière Java`,what:`Motif pour le nom d'utilisateur de la requête. Voir originalUser en cas de changement de l'utilisateur de session.`},selOriginalUser:{title:`originalUser`,unit:`expression régulière Java`,what:`Motif pour le nom d'utilisateur d'origine, avant tout changement de l'utilisateur de session. Si l'utilisateur foo exécute SET SESSION AUTHORIZATION bar, originalUser vaut foo et user vaut bar.`},selAuthenticatedUser:{title:`authenticatedUser`,unit:`expression régulière Java`,what:`Motif pour le nom de l'utilisateur authentifié, quels que soient les changements de l'utilisateur de session.`},selUserGroup:{title:`userGroup`,unit:`expression régulière Java`,what:`Motif pour les groupes auxquels l'utilisateur appartient. Un seul groupe correspondant suffit.`},selSource:{title:`source`,unit:`expression régulière Java`,what:`Motif pour la source de la requête. Le client la définit avec l'option --source de la CLI ou la propriété source du pilote JDBC.`},selQueryText:{title:`queryText`,unit:`expression régulière`,what:`Motif pour le texte SQL de la requête ; comme tout motif, il doit correspondre à la valeur entière.`},selQueryType:{title:`queryType`,unit:`SELECT, EXPLAIN, DESCRIBE, INSERT, UPDATE, MERGE, DEL
