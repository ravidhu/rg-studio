 is saturated`,tipParent:`{percent} % of {parent}`,tipHard:`Hard limit: {hard}`,tipLimited:`Limited by {reason}`,tipWeight:`Weight share: {percent} %`,limited:{noDemand:`no demand`,ownHard:`its own hard limit`,demand:`its demand, which is met`,subGroups:`what its sub-groups can use`,parentCap:`the limit of {group}`,weightShare:`the sharing by weight in {group}`,parentShare:`what {group} receives`},memoryTitle:`Memory ceilings`,cpuTitle:`CPU ceilings`,sumCeilings:`Ceilings add up to {percent} % of the cluster`,statusWithin:`Within the cluster`,statusAbove:`Above 100 %`,noLimit:`no limit`,aboveCluster:`above the cluster`,effective:`reached first`,limitedByGroup:`{group} is limited by {holder}: {value}`,limitedByOwn:`{group} is limited by its own limit: {value}`,noOwnUpTo:`no own limit (up to {value})`,aboveParent:`above its parent`,ofCluster:`{percent} % of the cluster`,limitedBy:`limited by {holder}: {value}`,clusterBox:`Cluster {value}`,aboveClusterBy:`+{percent} % above the cluster ({value})`,aboveOwnBy:`+{value}`,aboveOwnTip:`Sub-groups ask for {total} in total, {ratio}\xA0× this ceiling ({value})`,subBadge:`sub-groups: {total} ({ratio}\xA0×)`,excessLabel:`sub-groups: +{value} above {group}'s ceiling`,legendOwn:`own ceiling`,legendAbove:`above the ceiling`,legendNoOwn:`no own limit`,legendSoft:`soft limit`,softTick:`soft {value}`,cpuNoPeriod:`cpuQuotaPeriod is not set: CPU limits cannot be converted to vCPUs and cannot be enforced. Set it on the Configuration page, in the global settings of the Groups tab.`,cpuNone:`No group at this level has a CPU limit.`,memoryNone:`No group at this level has a memory limit.`,cpuPeriodMissing:`set, quota period missing`,concurrencyTitle:`Concurrency limits`,legendSlots:`queries obtained (group colour)`,legendHard:`room up to the hard limit`,legendParent:`each group's parent limit`,legendQueue:`queue capacity (group colour)`,legendHelpLabel:`Explain the legend`,legendHelpConcurrency:`Filled part: the simultaneous queries that the Soft limit tick: past it, the group lets its sibling groups, those of the same parent, take new simultaneous queries first.

Thin line: the maxQueued of the group's own parent.`,legendParentQueue:`each group's parent queue`,tipFilled:`{group} gets {slots} simultaneous queries of its hard limit of {hard}. Limited by {reason}.`,tipRest:`{rest} more simultaneous queries allowed by the hard limit, used only if other groups leave room.`,tipCap:`{parent}'s limit: {value}`,tipReceived:`{parent} receives {value}`,tipQueue:`{group} can hold {queued} queued queries.`,tipQueueCap:`{parent}'s queue: {value}`,parentLine:`Limit of {parent}: {value}`,slotsOfHard:`{slots} of {hard}`,queuesTitle:`Queues`,tableTitle:`Groups at this level`,colGroup:`Group`,colWeight:`Weight`,colWeightShare:`Weight share`,colShare:`Share of cluster`,colSlots:`Queries`,colMemory:`Memory, GB`,colCpu:`Hard CPU, vCPU`,colQueue:`Max queued`,colLimited:`Limited by`,expand:`Expand {group}`,collapse:`Collapse {group}`,expandAll:`Expand all`,collapseAll:`Collapse all`,levelEmpty:`No group to show at this level.`},softHard:{zoneRuns:`runs`,zoneLower:`lower priority`,zoneQueued:`queued`,zoneRejected:`rejected`,and:`and`,others:{one:`and {count} other`,other:`and {count} others`},runs:`Up to {soft} queries, {group} starts its queries normally.`,lower:`Between {soft} and {hard} queries, {group} goes after {siblings} (the other sub-groups of {parent}) when they have queries waiting and are still below their own soft limit.`,lowerOne:`Between {soft} and {hard} queries, {group} goes after {siblings} (the other sub-group of {parent}) when it has queries waiting and is still below its own soft limit.`,lowerAlone:`Between {soft} and {hard} queries, nothing changes for {group}: the soft limit has no effect without sibling groups under {parent}.`,lowerRoot:`Between {soft} and {hard} queries, nothing changes for {group}: it is a root group, and the soft limit only matters between sub-groups of the same parent.`,queued:`Once {hard} queries of {group} are running, its new queries wait in the queue, up to {queued} queued queries.`,rejected:`Beyond {queued} queued queries, the new queries of {group} are rejected.`},diagrams:{illustrative:`Illustrative values`,fromConfig:`Current configuration`,ancestors:`One running query (the dot) takes one place in its leaf group and in every group that contains it. Each box shows running queries / hard limit.`,query:`one running query`,oversubAbove:`The hard limits of the sub-groups of {parent} add up to {sum}, but {parent} lets only {cap} queries run at once. The part past the line cannot all be used at the same time.`,oversubWithin:`The hard limits of the sub-groups of {parent} add up to {sum}, within its own limit of {cap}: nothing is oversubscribed here.`,other:`others`,softHard:`Number of queries of {group}, not to scale. Up to the soft limit it starts queries normally. Between the soft and the hard limit it has a lower priority than the other sub-groups of its parent. At the hard limit new queries wait, and once maxQueued are waiting the next ones are rejected.`,exampleGroup:`group`,softWord:`soft`,hardWord:`hard`,exampleSibling:`another group`,leaf:`A selector can send queries to a group without sub-groups. A group that has sub-groups cannot receive queries.`,selectorWord:`selector`,parentWord:`parent`,receives:`receives queries`,rootsCaption:`Every limit of every root group, and their sums. Memory and CPU sums are also given as a share of the cluster.`,rootsRunning:`Running`,rootsQueued:`Queued`,rootsMemory:`Memory`,rootsCpu:`Hard CPU`,rootsSum:`Sum`,memory:`From the RAM of one worker to the GB of a group. The percentage of a group is applied to the cluster query memory.`,memRam:`RAM of one worker`,memHeap:`JVM heap, {percent} % of the RAM`,memQuery:`For all running queries: heap minus headroom`,memCluster:`Cluster query memory, x {workers} workers`,cpu:`Queries that {group} may run, depending on the CPU time it has used in the current period ({period}). Full concurrency up to the soft limit, then a penalty lowers it as the usage nears the hard limit.`,cpuAllowed:`queries allowed`,policies:`Twelve queries started under contention by three saturated sub-groups A, B and C. Only the policy of the parent changes. Under fair and query_priority the weights are ignored. Under weighted the split is a random draw, so the numbers are averages. Under query_priority the query with the highest priority runs first, whatever its group.`,polWeightA:`A, weight 3`,polWeightB:`B, weight 2`,polWeightC:`C, weight 1`,polPriority:`query priority`,polOrder:`highest first`,selectors:`Selectors of the current configuration, in evaluation order. A query takes the first one whose conditions all match and lands in its group.`,selQuery:`Query`,selAny:`any query`,selMore:`and {count} more`,selRejected:`No match`,selNone:`The configuration has no selector to draw.`,regex:`The pattern must cover the whole value. Filled characters are covered by the pattern. Dashed ones are left over, so the value does not match.`,regexPattern:`pattern`,regexValue:`value`,templates:`One template group gives one real group per user. Each created group gets the limits written on the template.`,tplUser:`user`,tplTemplate:`template group`,tplCreated:`created groups`,manager:`The same tree written twice: nested in the file, flat with a parent column in the database.`,model:`A parent with 100 simultaneous queries and three saturated children with weights 5, 3 and 2. A has a hard limit of 30.`,modelStep1:`1. Share by weight 5 : 3 : 2`,modelStep2:`2. A stops at its limit of 30, 20 are left over`,modelStep3:`3. The 20 are shared 3 : 2 between B and C`},topics:{conceptYaml:{title:`Accepted YAML shapes`,what:`Two YAML shapes are read, and the shape is recognised by its top keys. The first is the content of resource-groups.json written in YAML: rootGroups, subGroups, selectors and cpuQuotaPeriod, for the file-based manager. The second is a database loader format: environment, an ownership block, optional global_properties and external_groups, then groups nested under subgroups with an explicit id each, and selectors that name their group by its path and carry a priority.`,interaction:`Importing the first shape sets the manager to File, the second to Database. The export writes the shape that matches the manager. External groups are groups that exist in the database but are not defined in the file: selectors may target them, and their limits are not shown. The ownership block is kept for the export and not interpreted. Templating is not evaluated, tags and more than fifty aliases are refused.`},conceptMemoryOver:{title:`What it means when memory ceilings exceed 100 %`,what:`The memory ceilings of the groups at this level add up to more than the cluster query memory. This is allowed and common. A softMemoryLimit is a ceiling, not a reservation: no group is guaranteed its share, and the groups compete for the same cluster memory. A group stops admitting new queries once its own usage reaches its ceiling: new queries wait in the queue, and running queries are not stopped by the resource group.`,interaction:`Keeping the total at or below 100 % turns the ceilings into something close to reservations, but memory stays idle when a group is quiet. Going above 100 % favours the use of the cluster over the isolation of the groups.`},conceptCpuOver:{title:`What it means when CPU ceilings exceed 100 %`,what:`The hard CPU limits of the groups at this level add up to more vCPUs than the cluster has. This is allowed. A CPU limit caps the CPU time a group may use over the quota period, it does not reserve cores: no group is guaranteed CPU time, and the groups share the same cores. A group above its soft limit may run fewer queries, and new queries wait when a group runs out of CPU time. Running queries are not stopped.`,interaction:`At or below 100 %, every group could reach its limit at the same time. Above 100 %, the limits cannot all be reached together: the cores run out first, so the limits favour the use of the cluster over the isolation of the groups.`},conceptSunburst:{title:`Reading the simultaneous queries chart`,what:`This chart simulates the case where every group has queries waiting. Each group receives a share of the simultaneous queries of its parent in proportion to its weight (schedulingWeight): the higher the weight, the larger the share. For example, with weights 3 and 1, the first group gets 3 simultaneous queries out of 4. Weights count only when the policy of the parent is weighted or weighted_fair; with another policy the shares are equal, and a group without a weight counts for 1. A group never goes above its hard limit, nor above what its sub-groups can use: what it cannot take goes to the other groups of the same parent, again by their weights. The selected group is at the centre, and each ring outwards shows the next level of sub-groups.`,interaction:`Every percentage of the chart, of the list and of the tooltips is a share of what the parent receives, and the hard limit of each group is given in its tooltip. A group without sub-groups is drawn as one full ring. The Weight share mode shows only the weights: the weight of each group among its siblings, multiplied down the tree, before hard limits apply. Select a group with sub-groups to zoom into it, a leaf group to filter on it. The centre goes one level up. Root groups have no limit above them, so the chart shows one root at a time. The list beside the chart gives the figures.`},conceptCeilings:{title:`Reading the memory and CPU ceilings`,what:`Each card is a map of boxes whose area is an amount: GB of memory, or vCPUs from hardCpuLimit and the quota period. The scale is the same at every level. The dashed frame is the cluster: its area is the cluster query memory or the total vCPUs. The groups of the current level are placed inside it at their true size. When their ceilings add up to more than the cluster, the map goes on below the dashed line, that part is striped, and a label gives the excess. A line across a CPU box is the soft limit.`,interaction:`Select a box to show its sub-groups inside it. A closed box is exactly as large as the own ceiling of its group; when its sub-groups ask for more, a small label on the box gives their total. An opened box holds its sub-groups at their true size and grows when they ask for more than its ceiling: a dashed line then marks its own ceiling and the part beyond is striped. A group without a limit of its own shares what its parent leaves unreserved, is striped differently and never counts in an excess. The excess shown at the cluster line counts own ceilings only, like the status line above the map. The list gives the exact values.`},conceptSizing:{title:`How the cluster size is computed`,what:`The limits of a resource group are relative to the cluster. Its size, entered in the side menu, turns percentages and CPU time into GB and vCPUs. A group's memory percentage is a share of these {queryMemory}\xA0GB. All the memory used by the group's running queries counts toward it, including that of queries in its sub-groups. A single query is additionally capped by the per-query memory properties, query.max-memory across the cluster and query.max-memory-per-node on each worker, which are separate from resource groups. The heap share comes from the deployment guide (70 to 85 % of the node memory) and the headroom from the default of memory.heap-headroom-per-node (30 % of the heap). Replace them with the values of your jvm.config and config.properties. The coordinator is left out: it only counts when it also runs queries.`},conceptSoftHard:{title:`Soft and hard limits`,what:`A hard limit is a ceiling: hardConcurrencyLimit is the most queries a group runs, hardCpuLimit the most CPU time it uses in a period. A soft limit is a threshold where the group starts to give way: above softConcurrencyLimit it has a lower priority and goes after the other sub-groups of its parent when they have queries waiting and are still below their own soft limit, and above softCpuLimit the number of queries it may run is reduced.`,interaction:`No limit stops a running query, apart from the queue limit which rejects new ones. A group that runs out of a resource makes new queries wait.`},conceptAncestors:{title:`A query counts in its group and in every ancestor`,what:`A query belongs to one leaf group and consumes resources from that group and from all its ancestors up to the root. It runs only if every group on that path still has room.`,interaction:`This is why sub-groups may add up to more than their parent: the parent caps the total and the scheduling policy decides which sub-group goes next. Oversubscription of this kind is normal and lets a busy group use what an idle sibling leaves.`},conceptLeaf:{title:`Only leaf groups receive queries`,what:`A resource group either has sub-groups or accepts queries, never both. Selectors must therefore target groups without sub-groups.`},conceptClusterMemory:{title:`What the memory percentage refers to`,what:`A softMemoryLimit written as a percentage is a share of the memory of the cluster, the same base for every group whatever its depth. 50 % on a sub-group is half of the cluster, not half of its parent.`,interaction:`The parent still matters, because the memory of a query counts in every ancestor: the lowest limit on the path is reached first.`},conceptCpu:{title:`Reading CPU limits as vCPUs`,what:`softCpuLimit and hardCpuLimit are amounts of CPU time that the group may use per cpuQuotaPeriod. Dividing by the period gives an average number of busy vCPUs: 48h per 1h means 48 vCPUs kept busy for the whole hour.`,interaction:`Compare the result with the vCPUs of the cluster. A hard limit above the cluster size can never be reached. Soft limits of siblings that add up to more than the cluster cannot all be reached together.`},conceptPolicies:{title:`Scheduling policies`,unit:`fair, weighted_fair, weighted, query_priority`,fallback:`fair`,what:`The policy of a group decides how its queued queries are picked and how its sub-groups take turns. fair: first in, first out, and sub-groups take turns. weighted_fair: the sub-group that runs the fewest queries relative to its weight share goes next. weighted: sub-groups are drawn at random in proportion to their weight, and queries in proportion to their query_priority session property. query_priority: queries run strictly by priority, and every sub-group must use query_priority too.`,interaction:`The policy is set on the parent and the weights on its children. A weight has no effect under fair or query_priority.`},conceptSelectorOrder:{title:`Order of selectors`,what:`With the file-based manager, selectors are read in the order of the file and the first one that matches is used. With the database manager, they are processed in descending order of the priority column. All conditions of a selector must match.`},conceptRegex:{title:`Patterns are Java regular expressions`,what:`The user, source and similar conditions use the regular expressions of java.util.regex. This page runs patterns with the JavaScript engine and reports Java-only syntax instead of guessing.`,verified:`The pattern must match the whole value, as in the documentation example where a source that includes pipeline is written .*pipeline.*. All the fields of one selector must match together.`},conceptTemplates:{title:`Template variables`,unit:"${USER}, ${SOURCE}, named groups",what:"A group name may contain ${USER} or ${SOURCE}, replaced by the user or the source of the query, which creates one group per value. A named group of a selector pattern, such as (?<toolname>.*), can be used in the same way as ${toolname}.",interaction:`Each created group gets the limits written on the template, and they all count in the same parent.`},conceptRoots:{title:`Root groups are independent`,what:`${jb} The cluster-wide limits are the cluster query memory shared by all running queries and the per-query limits such as query.max-memory.`},conceptModel:{title:`How the simulation of simultaneous queries works`,what:`The page computes the stable state reached when every leaf group asks for more than it can get. Each parent shares its simultaneous queries between its children by weight. A child that reaches its hard limit, or the most its own children can use, keeps that amount, and the rest is shared again between the others. This is a model, not the scheduler. It ignores soft concurrency limits, memory and CPU limits, query priorities, arrival order, query duration and randomness.`},conceptManager:{title:`File or database manager`,what:`The file-based manager reads resource-groups.json on the coordinator. The database manager reads the resource_groups, selectors and resource_groups_global_properties tables and reloads them every second by default, so a change applies to incoming queries without a restart.`,interaction:`Both describe the same settings. Names differ slightly: camelCase keys in the file, snake_case columns in the tables, and the tree is nested in the file but expressed by the parent column in the tables. The manager that a configuration comes from sets how its selectors are ordered: by list order for a file, by descending priority for a database. An import and the example say which one it is; a configuration started from scratch asks. The Export control only chooses the format of the output: priorities are generated, or the list sorted, in the exported text, never in the configuration.`},name:{title:`name`,unit:`text, may be a template`,fallback:`required`,what:`Name of the group. The full name used by selectors is the path from the root, joined with dots, such as global.etl.`,interaction:`Unique among the sub-groups of one parent.`},maxQueued:{title:`maxQueued`,unit:`whole number of queries`,fallback:`required`,what:`Maximum number of queued queries. Once this limit is reached, new queries are rejected.`},hardConcurrencyLimit:{title:`hardConcurrencyLimit`,unit:`whole number of queries`,fallback:`required`,what:`Maximum number of running queries.`,interaction:`A running query also counts in every ancestor. Sub-groups may add up to more than their parent: the parent caps the total.`},softConcurrencyLimit:{title:`softConcurrencyLimit`,unit:`whole number of queries`,what:`Number of running queries above which the group has a lower priority: it goes after the other sub-groups of its parent when they have queries waiting and are still below their own soft limit.`,interaction:`Protects siblings: a group above its soft limit lets the others go first, but may still grow to its hard limit when they are idle.`},softMemoryLimit:{title:`softMemoryLimit`,unit:`percentage such as 80% or size such as 100GB`,what:`Maximum amount of distributed memory the group may use before new queries become queued. Running queries are not stopped.`,interaction:`A percentage is a share of the cluster memory, not of the parent. The memory of a query counts in every ancestor.`},softCpuLimit:{title:`softCpuLimit`,unit:`duration such as 10h`,what:`Maximum amount of CPU time the group may use in a period before a penalty is applied to the maximum number of running queries. hardCpuLimit must also be set.`,interaction:`Needs cpuQuotaPeriod. Must not be above hardCpuLimit.`},hardCpuLimit:{title:`hardCpuLimit`,unit:`duration such as 20h`,what:`Maximum amount of CPU time the group may use in a period.`,interaction:`Needs cpuQuotaPeriod. The CPU time of a query counts in every ancestor.`},hardPhysicalDataScanLimit:{title:`hardPhysicalDataScanLimit`,unit:`size such as 50TB`,what:`Maximum amount of data the group can scan in a period before new queries become queued. Must be an absolute size.`,interaction:`Needs physicalDataScanQuotaPeriod.`},schedulingPolicy:{title:`schedulingPolicy`,unit:`fair, weighted_fair, weighted, query_priority`,fallback:`fair`,what:`How queued queries are selected to run and how sub-groups become eligible to start their queries.`,interaction:`Applies to the sub-groups of the group where it is set. Under query_priority every sub-group must use query_priority too.`},schedulingWeight:{title:`schedulingWeight`,unit:`whole number`,fallback:`1`,what:`Weight of the sub-group, used when the policy of its parent is weighted or weighted_fair. With weights 350 and 150, about 70 % of the queries started come from the first sub-group and 30 % from the second.`,interaction:`Only the ratio between siblings matters. No effect on a root group or under fair and query_priority.`},jmxExport:{title:`jmxExport`,unit:`true or false`,fallback:`false`,what:`When true, the statistics of the group are exported to JMX for monitoring.`,interaction:`Set per group, not inherited.`},subGroups:{title:`subGroups`,unit:`list of groups`,what:`Sub-groups of the group. In the database the tree is given by the parent column, which holds the resource_group_id of the parent and is empty for a root.`,interaction:`A group with sub-groups cannot receive queries itself.`},environment:{title:`environment`,unit:`text`,what:`Matched with the node.environment property of the cluster, so that several clusters can keep their configuration in the same database.`},cpuQuotaPeriod:{title:`cpuQuotaPeriod`,unit:`duration such as 1h or 10m`,what:`The window over which the CPU limits of a group are counted: softCpuLimit and hardCpuLimit are amounts of CPU time per period. A hard limit of 48h with a period of 1h means that the queries of the group may use up to 48 vCPUs on average over each hour.`,verified:`A configuration that sets a CPU limit without a period is refused, with the message "cpuQuotaPeriod must be specified to use CPU limits on group: <name>". This applies to both managers: with the database manager, the new configuration is not applied and an error is logged. Set the period as soon as one group has a CPU limit.`},physicalDataScanQuotaPeriod:{title:`physicalDataScanQuotaPeriod`,unit:`duration such as 1h or 1d`,what:`The window over which hardPhysicalDataScanLimit is counted. That limit is the maximum amount of data the queries of a group can scan in one period before new queries are queued, written as an absolute size. A limit of 50TB with a period of 1d lets the group scan up to 50\xA0TB per day.`,verified:`A configuration that sets a data scan limit without physicalDataScanQuotaPeriod is refused, as for CPU limits. This applies to both managers: with the database manager, the new configuration is not applied and an error is logged. In the resource_groups_global_properties table the row is named physical_data_scan_quota_period, and the one of the CPU period cpu_quota_period: no other property name is accepted.`},selUser:{title:`user`,unit:`Java regular expression`,what:`Matched against the user name of the query.`},selOriginalUser:{title:`originalUser`,unit:`Java regular expression`,what:`Matched against the original user name, before any change of the session user. If user foo runs SET SESSION AUTHORIZATION bar, originalUser is foo and user is bar.`},selAuthenticatedUser:{title:`authenticatedUser`,unit:`Java regular expression`,what:`Matched against the authenticated user name, whatever changes were made to the session user.`},selUserGroup:{title:`userGroup`,unit:`Java regular expression`,what:`Matched against every group the user belongs to. One matching group is enough.`},selSource:{title:`source`,unit:`Java regular expression`,what:`Matched against the source of the query, set by the client with the --source option of the CLI or the source property of the JDBC driver.`},selQueryText:{title:`queryText`,unit:`regular expression`,what:`Matched against the SQL text of the query.`},selQueryType:{title:`queryType`,unit:`SELECT, EXPLAIN, DESCRIBE, INSERT, UPDATE, MERGE, DELETE, ANALYZE, DATA_DEFINITION, ALTER_TABLE_EXECUTE`,what:`Type of the query. INSERT also covers CREATE TABLE AS and REFRESH MATERIALIZED VIEW. DESCRIBE also covers SHOW queries. DATA_DEFINITION covers CREATE, ALTER and DROP statements and the management of sessions, privileges and transactions.`},selClientTags:{title:`clientTags`,unit:`list of tags`,what:`Every tag of the list must be among the client tags of the query, set with --client-tags or the clientTags property of the JDBC driver.`,interaction:`In the database the column holds a JSON list such as ["hipri"].`},selGroup:{title:`group`,unit:`path of a group`,fallback:`required`,what:`The group these queries run in. In the file it is the path joined with dots, such as global.etl. In the database it is the resource_group_id of the group.`,interaction:`Must be a leaf group.`},selPriority:{title:`priority`,unit:`whole number`,what:`Database only. Selectors are processed in descending order of priority, so the highest number is tried first.`,interaction:`In the file the order of the list plays this role.`}}},Nb=`Aucune limite commune : les groupes racines additionnent leurs limites et ne sont jamais départagés entre eux (les poids et la politique d'ordonnancement ne s'appliquent qu'entre sous-groupes d'un même parent). Seules les limites globales du cluster s'appliquent à leur total.`,Pb={app:{title:`RG Studio`,privacy:`Rien n'est envoyé nulle part : les fichiers restent dans votre navigateur.`,savedFull:`Votre configuration est enregistrée uniquement dans ce navigateur, sur cet ordinateur. Supprimez-la à tout moment depuis le menu latéral.`,savedShort:`La configuration est enregistrée dans ce navigateur uniquement.`,credit:`Fait avec {heart} par Ravidhu Dissanayake`,creditHeart:`amour`,language:`Langue`,theme:`Thème`,themeSystem:`Système`,themeLight:`Clair`,themeDark:`Sombre`,exampleData:`Données d'exemple, cliquez ici pour importer`,exampleEdited:`Données d'exemple modifiées, cliquez ici pour importer`},source:{question:`Où cette configuration sera-t-elle utilisée ?`,choose:`Choisir`,file:`Gestionnaire par fichier (resource-groups.json)`,db:`Gestionnaire par base de données (tables)`,prompt:`Indiquez où cette configuration sera utilisée : l'ordre d'évaluation des sélecteurs en dépend.`,promptLink:`Choisir le gestionnaire`,order:`Ordre ription est normale : {group} les plafonne et la politique d'ordonnancement décide qui s'exécute.`,childrenHardSumBelow:`Les sous-groupes de {group} totalisent {sum} requêtes en cours, moins que sa limite de {parent}. La limite de {group} ne peut jamais être atteinte.`,childrenQueueSumAbove:`Les sous-groupes de {group} totalisent {sum} requêtes en attente pour une limite de {parent}.`,childrenQueueSumBelow:`Les sous-groupes de {group} totalisent {sum} requêtes en attente, moins que sa limite de {parent}.`,siblingSoftCpuSum:`Les limites souples de CPU des sous-groupes de {group} totalisent {sum} vCPU, plus que les {ceiling} vCPU disponibles ({against}). Elles ne peuvent pas toutes être atteintes en même temps.`,weightsAllMissing:`{group} utilise la politique {policy} mais aucun de ses sous-groupes n'a de poids : chacun compte pour 1, soit un partage égal.`,weightMissing:`{group} n'a pas de poids alors que d'autres groupes de sa fratrie en ont un. Avec la politique {policy} de {parent}, il compte pour 1.`,weightIgnored:`Le poids de {group} n'a aucun effet : son parent {parent} utilise la politique {policy}, qui ignore les poids.`,weightOnRoot:`Le poids de {group} n'a aucun effet : un groupe racine n'a pas de fratrie à laquelle être comparé.`,queryPriorityChildren:`{group} doit utiliser la politique query_priority, car son parent {parent} l'utilise.`,independentRoots:`Les {count} groupes racines n'ont aucune limite commune : leurs limites s'additionnent, pour {sum} requêtes en cours au total.`,jmxPartial:`jmxExport est activé pour {exported} groupes sur {total}. Non exportés : {missing}.`,jmxPartialMore:`jmxExport est activé pour {exported} groupes sur {total}. Non exportés : {missing}, et {more} autres.`,selectorExternalGroup:`Le sélecteur {position} cible {target}, un groupe déclaré comme externe : il existe dans la base mais n'est pas défini dans le fichier importé, ses limites ne sont donc pas affichées.`,selectorMissingGroup:`Le sélecteur {position} cible un group rker`,memHeap:`Mémoire heap de la JVM, {percent} % de la RAM`,memQuery:`Pour toutes les requêtes : heap moins marge`,memCluster:`Mémoire de requêtes du cluster, x {workers} workers`,cpu:`Requêtes que {group} peut exécuter selon le temps CPU qu'il a consommé sur la période en cours ({period}). Concurrence complète jusqu'à la limite souple, puis une pénalité la réduit à mesure que la consommation approche de la limite stricte.`,cpuAllowed:`requêtes autorisées`,policies:`Douze requêtes démarrées sous contention par trois sous-groupes saturés A, B et C. Seule la politique du parent change. Avec fair et query_priority, les poids sont ignorés. Avec weighted, la répartition est un tirage au sort : les nombres sont des moyennes. Avec query_priority, la requête de plus haute priorité passe en premier, quel que soit son groupe.`,polWeightA:`A, poids 3`,polWeightB:`B, poids 2`,polWeightC:`C, poids 1`,polPriority:`priorité de la requête`,polOrder:`la plus haute d'abord`,selectors:`Sélecteurs de la configuration actuelle, dans l'ordre d'évaluation. Une requête prend le premier dont toutes les conditions correspondent et arrive dans son groupe.`,selQuery:`Requête`,selAny:`toute requête`,selMore:`et {count} autres`,selRejected:`Aucune correspondance`,selNone:`La configuration ne contient aucun sélecteur à représenter.`,regex:`Le motif doit couvrir la valeur entière. Les caractères pleins sont couverts par le motif. Ceux en pointillés restent en trop : la valeur ne correspond donc pas.`,regexPattern:`motif`,regexValue:`valeur`,templates:`Un groupe modèle donne un groupe réel par utilisateur. Chaque groupe créé reçoit les limites écrites sur le modèle.`,tplUser:`utilisateur`,tplTemplate:`groupe modèle`,tplCreated:`groupes créés`,manager:`Le même arbre écrit deux fois : imbriqué dans le fichier, à plat avec une colonne parent dans la base.`,model:`Un parent de 100 requêtes simultanées et trois enfants saturés de poids 5, 3 et 2. A a une limite stricte de 30.`,modelStep1:`1. Partage selon les poids 5 : 3 : 2`,modelStep2:`2. A s'arrête à sa limite de 30, il reste 20`,modelStep3:`3. Les 20 sont partagés 3 : 2 entre B et C`},topics:{conceptYaml:{title:`Formes de YAML acceptées`,what:`Deux formes de YAML sont lues, et la forme est reconnue à ses clés de premier niveau. La première est le contenu de resource-groups.json écrit en YAML : rootGroups, subGroups, selectors et cpuQuotaPeriod, pour le gestionnaire par fichier. La seconde est un format de chargement en base : environment, un bloc ownership, global_properties et external_groups facultatifs, puis groups imbriqués sous subgroups avec un id explicite chacun, et selectors qui nomment leur groupe par son chemin et portent une priorité.`,interaction:`Importer la première forme règle le gestionnaire sur Fichier, la seconde sur Base de données. L'export écrit la forme qui correspond au gestionnaire. Les groupes externes existent dans la base mais ne sont pas définis dans le fichier : des sélecteurs peuvent les cibler, et leurs limites ne sont pas affichées. Le bloc ownership est conservé pour l'export et n'est pas interprété. Les modèles de texte ne sont pas évalués, les tags et plus de cinquante alias sont refusés.`},conceptMemoryOver:{title:`Ce que signifie un total de plafonds de mémoire supérieur à 100 %`,what:`La somme des plafonds de mémoire des groupes de ce niveau dépasse la mémoire de requêtes du cluster. C'est autorisé et courant. Un softMemoryLimit est un plafond, pas une réservation : aucun groupe n'a la garantie d'obtenir sa part, et les groupes se disputent la même mémoire du cluster. Un groupe cesse d'admettre de nouvelles requêtes lorsque sa propre consommation atteint son plafond : les nouvelles requêtes attendent dans la file, et les requêtes en cours ne sont pas arrêtées par le groupe de ressources.`,interaction:`Garder le total à 100 % ou moins rapproche les plafonds d'une réservation, mais de la mémoire reste inutilisée lorsqu'un groupe est calme. Dépasser 100 % privilégie l'utilisation du cluster par rapport à l'isolation des groupes.`},conceptCpuOver:{title:`Ce que signifie un total de plafonds de CPU supérieur à 100 %`,what:`La somme des limites strictes de CPU des groupes de ce niveau dépasse les vCPU du cluster. C'est autorisé. Une limite CPU plafonne le temps CPU qu'un groupe peut consommer sur la période de quota, elle ne réserve pas de cœurs : aucun groupe n'a la garantie d'obtenir du temps CPU, et les groupes partagent les mêmes cœurs. Un groupe au-dessus de sa limite souple peut exécuter moins de requêtes, et les nouvelles requêtes attendent lorsqu'un groupe a épuisé son temps CPU. Les requêtes en cours ne sont pas arrêtées.`,interaction:`À 100 % ou moins, tous les groupes pourraient atteindre leur limite en même temps. Au-delà de 100 %, les limites ne peuvent pas toutes être atteintes ensemble : les cœurs manquent en premier, et les limites privilégient donc l'utilisation du cluster par rapport à l'isolation des groupes.`},conceptSunburst:{title:`Lire le graphique des requêtes simultanées`,what:`Ce graphique simule le cas où tous les groupes ont des requêtes en attente. Chaque groupe reçoit une part des requêtes simultanées de son parent proportionnelle à son poids (schedulingWeight) : plus le poids est élevé, plus la part est grande. Par exemple, avec des poids 3 et 1, le premier groupe obtient 3 requêtes simultanées sur 4. Les poids ne comptent que si la politique du parent est weighted ou weighted_fair ; avec une autre politique les parts sont égales, et un groupe sans poids compte pour 1. Un groupe ne dépasse jamais sa limite stricte, ni ce que ses sous-groupes peuvent utiliser : ce qu'il ne peut pas prendre revient aux autres groupes du même parent, toujours selon leurs poids. Le groupe sélectionné est au centre, et chaque anneau vers l'extérieur montre le niveau suivant de sous-groupes.`,interaction:`Chaque pourcentage du graphique, de la liste et des infobulles est une part de ce que reçoit le parent, et la limite stricte de chaque groupe figure dans son infobulle. Un groupe sans sous-groupe est dessiné comme un anneau complet. Le mode Part de poids montre uniquement les poids : le poids de chaque groupe dans sa fratrie, multiplié le long de l'arbre, avant application des limites strictes. Sélectionnez un groupe ayant des sous-groupes pour zoomer dessus, un groupe feuille pour filtrer sur lui. Le centre remonte d'un niveau. Les groupes racines n'ont aucune limite commune : le graphique montre donc une racine à la fois. La liste à côté du graphique donne les valeurs.`},conceptCeilings:{title:`Lire les plafonds de mémoire et de CPU`,what:`Chaque carte est un plan de boîtes dont l'aire est une quantité : des Go de mémoire, ou des vCPU issus de hardCpuLimit et de la période de quota. L'échelle est la même à tous les niveaux. Le cadre en tirets est le cluster : son aire est la mémoire de requêtes du cluster ou le total de vCPU. Les groupes du niveau courant y sont placés à leur taille réelle. Quand la somme de leurs plafonds dépasse le cluster, le plan continue sous la ligne en tirets, cette partie est rayée et une étiquette donne le dépassement. Un trait en travers d'une boîte de CPU est la limite souple.`,interaction:`Sélectionnez une boîte pour afficher ses sous-groupes à l'intérieur. Une boîte fermée a exactement la taille du plafond propre de son groupe ; quand ses sous-groupes demandent davantage, une petite étiquette sur la boîte donne leur total. Une boîte ouverte contient ses sous-groupes à leur taille réelle et grandit quand ils demandent plus que son plafond : une ligne en tirets marque alors son propre plafond et la partie au-delà est rayée. Un groupe sans limite propre se partage ce que son parent laisse non réservé, porte d'autres rayures et ne compte jamais dans un dépassement. Le dépassement affiché à la ligne du cluster ne compte que les plafonds propres, comme la ligne d'état au-dessus du plan. La liste donne les valeurs exactes.`},conceptSizing:{title:`Calcul de la taille du cluster`,what:`Les limites d'un groupe de ressources sont relatives au cluster. Sa taille, saisie dans le menu latéral, convertit les pourcentages et les temps CPU en Go et en vCPU. Le pourcentage mémoire d'un groupe est une part de ces {queryMemory}\xA0Go. Toute la mémoire utilisée par les requêtes en cours du groupe compte dans cette part, y compris celle des requêtes de ses sous-groupes. Une requête seule est en outre plafonnée par les propriétés de mémoire par requête, query.max-memory sur l'ensemble du cluster et query.max-memory-per-node sur chaque worker, qui sont distinctes des groupes de ressources. La part de la mémoire heap de la JVM vient du guide de déploiement (70 à 85 % de la mémoire du nœud) et la marge vient de la valeur par défaut de memory.heap-headroom-per-node (30 % de la mémoire heap). Remplacez-les par les valeurs de vos fichiers jvm.config et config.properties. Le coordinateur n'est pas compté : il ne compte que s'il exécute lui aussi des requêtes.`},conceptSoftHard:{title:`Limites souples et limites strictes`,what:`Une limite stricte (hard) est un plafond : hardConcurrencyLimit est le nombre maximal de requêtes qu'un groupe exécute, hardCpuLimit le temps CPU maximal qu'il consomme par période. Une limite souple (soft) est un seuil à partir duquel le groupe commence à céder son tour : au-dessus de softConcurrencyLimit, il a une priorité réduite et passe après les autres sous-groupes de son parent quand ils ont des requêtes en attente et sont encore sous leur limite souple, et au-dessus de softCpuLimit, le nombre de requêtes qu'il peut exécuter est réduit.`,interaction:`Aucune limite n'arrête une requête en cours, hormis la limite de file d'attente, qui rejette les nouvelles requêtes. Un groupe à court d'une ressource fait attendre les nouvelles requêtes.`},conceptAncestors:{title:`Une requête compte dans son groupe et dans chaque ancêtre`,what:`Une requête appartient à un seul groupe feuille et consomme les ressources de ce groupe et de tous ses ancêtres jusqu'à la racine. Elle ne s'exécute que si chaque groupe de ce chemin a encore de la capacité.`,interaction:`C'est pourquoi la somme des sous-groupes peut dépasser leur parent : le parent plafonne le total et la politique d'ordonnancement décide quel sous-groupe passe ensuite. Cette sursouscription est normale et permet à un groupe occupé d'utiliser ce qu'un groupe inactif de sa fratrie laisse libre.`},conceptLeaf:{title:`Seuls les groupes feuilles reçoivent des requêtes`,what:`Un groupe de ressources a soit des sous-groupes, soit des requêtes, jamais les deux. Les sélecteurs doivent donc cibler des groupes sans sous-groupe.`},conceptClusterMemory:{title:`À quoi se rapporte le pourcentage de mémoire`,what:`Un softMemoryLimit écrit en pourcentage est une part de la mémoire du cluster, la même base pour tous les groupes quelle que soit leur profondeur. 50 % sur un sous-groupe représente la moitié du cluster, pas la moitié de son parent.`,interaction:`Le parent compte tout de même, car la mémoire d'une requête est comptée dans chaque ancêtre : la limite la plus basse du chemin est atteinte en premier.`},conceptCpu:{title:`Lire les limites CPU en vCPU`,what:`softCpuLimit et hardCpuLimit sont des quantités de temps CPU que le groupe peut consommer par cpuQuotaPeriod. En divisant par la période, on obtient un nombre moyen de vCPU occupés : 48h par 1h signifie 48 vCPU occupés pendant toute l'heure.`,interaction:`Comparez le résultat avec les vCPU du cluster. Une limite stricte supérieure à la taille du cluster ne peut jamais être atteinte. Des limites souples dont la somme, dans une fratrie, dépasse le cluster ne peuvent pas toutes être atteintes ensemble.`},conceptPolicies:{title:`Politiques d'ordonnancement`,unit:`fair, weighted_fair, weighted, query_priority`,fallback:`fair`,what:`La politique d'un groupe décide comment ses requêtes en attente sont choisies et comment ses sous-groupes passent à tour de rôle. fair : premier arrivé, premier servi, et les sous-groupes passent chacun leur tour. weighted_fair : le sous-groupe qui exécute le moins de requêtes par rapport à sa part de poids passe ensuite. weighted : les sous-groupes sont tirés au sort en proportion de leur poids, et les requêtes en proportion de leur propriété de session query_priority. query_priority : les requêtes s'exécutent strictement par priorité, et chaque sous-groupe doit lui aussi utiliser query_priority.`,interaction:`La politique se règle sur le parent et les poids sur ses enfants. Un poids n'a aucun effet avec fair ou query_priority.`},conceptSelectorOrder:{title:`Ordre des sélecteurs`,what:`Avec le gestionnaire par fichier, les sélecteurs sont lus dans l'ordre du fichier et le premier qui correspond est utilisé. Avec le gestionnaire par base de données, ils sont traités par ordre décroissant de la colonne priority. Toutes les conditions d'un sélecteur doivent correspondre.`},conceptRegex:{title:`Les motifs sont des expressions régulières Java`,what:`Les conditions user, source et similaires utilisent les expressions régulières de java.util.regex. Cette page exécute les motifs avec le moteur JavaScript et signale la syntaxe propre à Java au lieu de la deviner.`,verified:`Le motif doit correspondre à la valeur entière, comme dans l'exemple de la documentation où une source qui contient pipeline s'écrit .*pipeline.*. Tous les champs d'un même sélecteur doivent correspondre ensemble.`},conceptTemplates:{title:`Variables de modèle`,unit:"${USER}, ${SOURCE}, groupes nommés",what:"Un nom de groupe peut contenir ${USER} ou ${SOURCE}, remplacés par l'utilisateur ou la source de la requête, ce qui crée un groupe par valeur. Un groupe nommé d'un motif de sélecteur, tel que (?<toolname>.*), s'utilise de la même façon sous la forme ${toolname}.",interaction:`Chaque groupe créé reçoit les limites écrites sur le modèle, et tous comptent dans le même parent.`},conceptRoots:{title:`Les groupes racines sont indépendants`,what:`${Nb} Les limites globales du cluster sont la mémoire de requêtes du cluster, partagée par toutes les requêtes en cours, et les limites par requête telles que query.max-memory.`},conceptModel:{title:`Fonctionnement de la simulation des requêtes simultanées`,what:`La page calcule l'état stable atteint lorsque chaque groupe feuille demande plus qu'il ne peut obtenir. Chaque parent partage ses requêtes simultanées entre ses enfants selon leur poids. Un enfant qui atteint sa limite stricte, ou le maximum que ses propres enfants peuvent utiliser, conserve cette quantité, et le reste est de nouveau partagé entre les autres. C'est un modèle, pas l'ordonnanceur. Il ignore les limites souples de concurrence, les limites de mémoire et de CPU, les priorités des requêtes, l'ordre d'arrivée, la durée des requêtes et l'aléa.`},conceptManager:{title:`Gestionnaire par fichier ou par base de données`,what:`Le gestionnaire par fichier lit resource-groups.json sur le coordinateur. Le gestionnaire par base de données lit les tables resource_groups, selectors et resource_groups_global_properties et les recharge chaque seconde par défaut : une modification s'applique donc aux requêtes entrantes sans redémarrage.`,interaction:`Les deux décrivent les mêmes réglages. Les noms diffèrent légèrement : clés en camelCase dans le fichier, colonnes en snake_case dans les tables, et l'arbre est imbriqué dans le fichier mais exprimé par la colonne parent dans les tables. Le gestionnaire dont provient une configuration détermine l'ordre de ses sélecteurs : ordre de la liste pour un fichier, priorité décroissante pour une base de données. Un import et l'exemple indiquent lequel ; une configuration créée de zéro le demande. Le contrôle d'export ne choisit que le format de la sortie : les priorités sont générées, ou la liste triée, dans le texte exporté, jamais dans la configuration.`},name:{title:`name`,unit:`texte, peut être un modèle`,fallback:`obligatoire`,what:`Nom du groupe. Le nom complet utilisé par les sélecteurs est le chemin depuis la racine, séparé par des points, par exemple global.etl.`,interaction:`Unique parmi les sous-groupes d'un même parent.`},maxQueued:{title:`maxQueued`,unit:`nombre entier de requêtes`,fallback:`obligatoire`,what:`Nombre maximal de requêtes en attente. Une fois cette limite atteinte, les nouvelles requêtes sont rejetées.`},hardConcurrencyLimit:{title:`hardConcurrencyLimit`,unit:`nombre entier de requêtes`,fallback:`obligatoire`,what:`Nombre maximal de requêtes en cours d'exécution.`,interaction:`Une requête en cours compte aussi dans chaque ancêtre. La somme des sous-groupes peut dépasser leur parent : le parent plafonne le total.`},softConcurrencyLimit:{title:`softConcurrencyLimit`,unit:`nombre entier de requêtes`,what:`Nombre de requêtes en cours au-dessus duquel le groupe a une priorité réduite : il passe après les autres sous-groupes de son parent quand ils ont des requêtes en attente et sont encore sous leur limite souple.`,interaction:`Protège la fratrie : un groupe au-dessus de sa limite souple laisse passer les autres, mais peut encore monter jusqu'à sa limite stricte lorsqu'ils sont inactifs.`},softMemoryLimit:{title:`softMemoryLimit`,unit:`pourcentage tel que 80% ou taille telle que 100GB`,what:`Quantité maximale de mémoire distribuée que le groupe peut utiliser avant que les nouvelles requêtes soient mises en attente. Les requêtes en cours ne sont pas arrêtées.`,interaction:`Un pourcentage est une part de la mémoire du cluster, pas du parent. La mémoire d'une requête compte dans chaque ancêtre.`},softCpuLimit:{title:`softCpuLimit`,unit:`durée telle que 10h`,what:`Quantité maximale de temps CPU que le groupe peut consommer par période avant qu'une pénalité soit appliquée au nombre maximal de requêtes en cours. hardCpuLimit doit aussi être défini.`,interaction:`Nécessite cpuQuotaPeriod. Ne doit pas dépasser hardCpuLimit.`},hardCpuLimit:{title:`hardCpuLimit`,unit:`durée telle que 20h`,what:`Quantité maximale de temps CPU que le groupe peut consommer par période.`,interaction:`Nécessite cpuQuotaPeriod. Le temps CPU d'une requête compte dans chaque ancêtre.`},hardPhysicalDataScanLimit:{title:`hardPhysicalDataScanLimit`,unit:`taille telle que 50TB`,what:`Quantité maximale de données que le groupe peut lire par période avant que les nouvelles requêtes soient mises en attente. Doit être une taille absolue.`,interaction:`Nécessite physicalDataScanQuotaPeriod.`},schedulingPolicy:{title:`schedulingPolicy`,unit:`fair, weighted_fair, weighted, query_priority`,fallback:`fair`,what:`Façon dont les requêtes en attente sont choisies pour s'exécuter et dont les sous-groupes deviennent éligibles pour démarrer leurs requêtes.`,interaction:`S'applique aux sous-groupes du groupe sur lequel elle est définie. Avec query_priority, chaque sous-groupe doit lui aussi utiliser query_priority.`},schedulingWeight:{title:`schedulingWeight`,unit:`nombre entier`,fallback:`1`,what:`Poids du sous-groupe, utilisé lorsque la politique de son parent est weighted ou weighted_fair. Avec des poids de 350 et 150, environ 70 % des requêtes démarrées viennent du premier sous-groupe et 30 % du second.`,interaction:`Seul le rapport entre les groupes d'une fratrie compte. Sans effet sur un groupe racine ou avec fair et query_priority.`},jmxExport:{title:`jmxExport`,unit:`true ou false`,fallback:`false`,what:`Si true, les statistiques du groupe sont exportées vers JMX pour la supervision.`,interaction:`Se règle groupe par groupe, sans héritage.`},subGroups:{title:`subGroups`,unit:`liste de groupes`,what:`Sous-groupes du groupe. Dans la base, l'arbre est donné par la colonne parent, qui contient le resource_group_id du parent et reste vide pour une racine.`,interaction:`Un groupe qui a des sous-groupes ne peut pas recevoir de requêtes lui-même.`},environment:{title:`environment`,unit:`texte`,what:`Comparé à la propriété node.environment du cluster, afin que plusieurs clusters puissent conserver leur configuration dans la même base.`},cpuQuotaPeriod:{title:`cpuQuotaPeriod`,unit:`durée telle que 1h ou 10m`,what:`Fenêtre sur laquelle les limites CPU d'un groupe sont comptées : softCpuLimit et hardCpuLimit sont des quantités de temps CPU par période. Une limite stricte de 48h avec une période de 1h signifie que les requêtes du groupe peuvent utiliser jusqu'à 48 vCPU en moyenne sur chaque heure.`,verified:`Une configuration qui définit une limite CPU sans période est refusée, avec le message « cpuQuotaPeriod must be specified to use CPU limits on group: <name> ». Cela vaut pour les deux gestionnaires : avec le gestionnaire par base de données, la nouvelle configuration n'est pas appliquée et une erreur est journalisée. Définissez la période dès qu'un groupe a une limite CPU.`},physicalDataScanQuotaPeriod:{title:`physicalDataScanQuotaPeriod`,unit:`durée telle que 1h ou 1d`,what:`Fenêtre sur laquelle hardPhysicalDataScanLimit est compté. Cette limite est la quantité maximale de données que les requêtes d'un groupe peuvent lire par période avant que les nouvelles requêtes soient mises en attente, écrite comme une taille absolue. Une limite de 50TB avec une période de 1d laisse le groupe lire jusqu'à 50\xA0To par jour.`,verified:`Une configuration qui définit une limite de données lues sans physicalDataScanQuotaPeriod est refusée, comme pour les limites CPU. Cela vaut pour les deux gestionnaires : avec le gestionnaire par base de données, la nouvelle configuration n'est pas appliquée et une erreur est journalisée. Dans la table resource_groups_global_properties, la ligne se nomme physical_data_scan_quota_period, et celle de la période CPU cpu_quota_period : aucun autre nom de propriété n'est accepté.`},selUser:{title:`user`,unit:`expression régulière Java`,what:`Comparée au nom d'utilisateur de la requête.`},selOriginalUser:{title:`originalUser`,unit:`expression régulière Java`,what:`Comparée au nom d'utilisateur d'origine, avant tout changement de l'utilisateur de session. Si l'utilisateur foo exécute SET SESSION AUTHORIZATION bar, originalUser vaut foo et user vaut bar.`},selAuthenticatedUser:{title:`authenticatedUser`,unit:`expression régulière Java`,what:`Comparée au nom de l'utilisateur authentifié, quels que soient les changements de l'utilisateur de session.`},selUserGroup:{title:`userGroup`,unit:`expression régulière Java`,what:`Comparée à chaque groupe auquel l'utilisateur appartient. Un seul groupe correspondant suffit.`},selSource:{title:`source`,unit:`expression régulière Java`,what:`Comparée à la source de la requête, définie par le client avec l'option --source de la CLI ou la propriété source du pilote JDBC.`},selQueryText:{title:`queryText`,unit:`expression régulière`,what:`Comparée au texte SQL de la requête.`},selQueryType:{title:`queryType`,unit:`SELECT, EXPLAIN, DESCRIBE, INSERT, UPDATE, MERGE, DELETE, ANALYZE, DATA_DEFINITION, ALTER_TABLE_EXECUTE`,what:`Type de la requête. INSERT couvre aussi CREATE TABLE AS et REFRESH MATERIALIZED VIEW. DESCRIBE couvre aussi les requêtes SHOW. DATA_DEFINITION couvre les instructions CREATE, ALTER et DROP ainsi que la gestion des sessions, des privilèges et des transactions.`},selClientTags:{title:`clientTags`,unit:`liste de tags`,what:`Chaque tag de la liste doit figurer parmi les tags client de la requête, définis avec --client-tags ou la propriété clientTags du pilote JDBC.`,interaction:`Dans la base, la colonne contient une liste JSON telle que ["hipri"].`},selGroup:{title:`group`,unit:`chemin d'un groupe`,fallback:`obligatoire`,what:`Groupe dans lequel ces requêtes s'exécutent. Dans le fichier, c'est le chemin séparé par des points, par exemple global.etl. Dans la base, c'est le resource_group_id du groupe.`,interaction:`Doit être un groupe feuille.`},selPriority:{title:`priority`,unit:`nombre entier`,what:`Base de données uniquement. Les sélecteurs sont traités par ordre décroissant de priorité : le nombre le plus élevé est essayé en premier.`,interaction:`Dans le fichier, l'ordre de la liste joue ce rôle.`}}};function Fb(){let e=Uy(`lang`);return e===`en`||e===`fr`?e:navigator.language.toLowerCase().startsWith(`fr`)?`fr`:`en`}function Ib({children:e}){let[t,n]=(0,D.useState)(Fb);(0,D.useEffect)(()=>{document.documentElement.lang=t,Wy(`lang`,t)},[t]);let r=(0,D.useCallback)(e=>n(e),[]),i=(0,D.useMemo)(()=>{let e=t===`fr`?Pb:Mb,n=new Intl.PluralRules(t);return{lang:t,setLang:r,t:e,fill:pt,plural:(e,r)=>pt(n.select(e)===`one`?r.one:r.other,{count:W_(t,e,0)}),num:(e,n=0)=>W_(t,e,n),gb:(e,n=1)=>K_(t,e,n),unit:(e=`GB`)=>G_(t,e)}},[t,r]);return(0,H.jsx)(ft.Provider,{value:i,children:e})}var Lb=document.getElementById(`root`);Lb&&(0,dt.createRoot)(Lb).render((0,H.jsx)(D.StrictMode,{children:(0,H.jsx)(Ib,{children:(0,H.jsx)(Ab,{children:(0,H.jsx)(Db,{})})})}));</script>
